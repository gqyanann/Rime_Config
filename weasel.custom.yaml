# Weasel（小狼毫）界面皮肤
# 风格：macOS 现代简约风 —— 深色 / 浅色两套，跟随系统自动切换
# 来源：kylin 的 Weasel 皮肤配置，已按本机实际情况适配
#
# ⚠️ 改完要同步两个地方：
#    E:\Rime\Data\weasel.custom.yaml   （引擎实际读这个）
#    E:\Rime\Config\weasel.custom.yaml （仓库版；sync.ps1 每轮都会拿它覆盖用户目录同名文件）
#
# ⚠️ 生效命令（不要用开始菜单的图形设定，那个会弹 WeaselDeployer 卡住）：
#    powershell -NoProfile -ExecutionPolicy Bypass -File E:\Rime\Data\deploy_headless.ps1 -ConfigFile weasel.yaml

patch:
  # ─── 全局交互 ───
  show_notifications: false        # 关闭方案切换气泡，保持输入纯净
  show_notifications_time: 800     # 气泡时长 (ms)
  global_ascii: false              # 中英切换不跨窗口广播

  # ─── 字体排版 ───
  # font_face 用逗号分隔会作为 fallback 链依次尝试；本机没有 PingFang SC / D-DIN，
  # 实际落到 Microsoft YaHei。
  style:
    color_scheme: macOS_Light        # 白天配色
    color_scheme_dark: macOS_Dark    # 系统深色时自动切这套
    font_face: "PingFang SC, Microsoft YaHei, Segoe UI"
    font_point: 11
    label_font_face: "D-DIN, PingFang SC, Microsoft YaHei"
    label_font_point: 8
    comment_font_face: "PingFang SC, Microsoft YaHei"
    comment_font_point: 10
    label_format: "%s"               # 序号只留数字，不带点或括号
    mark_text: ""                    # 选中项不加额外标记

    # ─── 渲染 ───
    # 原文写 force_dword（0xffffffff 传给 Direct2D 是非法枚举，有崩候选窗的风险），
    # 这里改成 cleartype：同样是次像素渲染，效果接近且安全。
    antialias_mode: cleartype
    horizontal: true                 # 候选横排
    inline_preedit: true             # 编码直接显示在应用内（行内预编辑）
    preedit_type: composition        # 预编辑区显示原始编码

    # ─── 胶囊布局 ───
    layout:
      border_width: 0                # 去掉窗口描边（macOS 风格的干净边）
      align_type: center
      max_width: 1200
      min_width: 10
      margin_x: 8
      margin_y: 5
      candidate_spacing: 4
      hilite_spacing: 3
      hilite_padding: 3
      hilite_padding_x: 6
      corner_radius: 14              # 候选窗外圆角
      round_corner: 12               # 选中色块圆角
      shadow_radius: 8
      shadow_offset_x: 0
      shadow_offset_y: 2

  app_options:
    # ─── 聊天与通讯软件 (自动中文) ───
    wechat.exe:
      ascii_mode: false
    weixin.exe:            # 新版微信 4.x
      ascii_mode: false
    wechatappex.exe:
      ascii_mode: false
    wxwork.exe:
      ascii_mode: false
    qq.exe:
      ascii_mode: false
    telegram.exe:
      ascii_mode: false
    discord.exe:
      ascii_mode: false
    feishu.exe:
      ascii_mode: false
    lark.exe:
      ascii_mode: false
    dingtalk.exe:
      ascii_mode: false
    whatsapp.exe:
      ascii_mode: false
    line.exe:
      ascii_mode: false
    teams.exe:
      ascii_mode: false
    ms-teams.exe:
      ascii_mode: false

    # ─── 网页浏览器 (自动中文) ───
    chrome.exe:
      ascii_mode: false
    msedge.exe:
      ascii_mode: false
    firefox.exe:
      ascii_mode: false
    brave.exe:
      ascii_mode: false
    opera.exe:
      ascii_mode: false
    vivaldi.exe:
      ascii_mode: false
    arc.exe:
      ascii_mode: false
    iexplore.exe:
      ascii_mode: false

    # ─── 以下为「显式英文」，保证即使将来改动 reset 也不会在这里翻车 ───
    # (未列出的 App 本来就默认英文，这里只是把核心工具钉死)
    # 办公沟通以英文为主
    slack.exe:
      ascii_mode: true
    # 系统外壳 / 资源管理器 / 设置 / 搜索
    explorer.exe:
      ascii_mode: true
    notepad.exe:
      ascii_mode: true
    systemsettings.exe:
      ascii_mode: true
    applicationframehost.exe:
      ascii_mode: true
    searchapp.exe:
      ascii_mode: true
    searchhost.exe:
      ascii_mode: true
    # 终端与命令行
    windowsterminal.exe:
      ascii_mode: true
    openconsole.exe:
      ascii_mode: true
    conhost.exe:
      ascii_mode: true
    cmd.exe:
      ascii_mode: true
    powershell.exe:
      ascii_mode: true
    pwsh.exe:
      ascii_mode: true
    wt.exe:
      ascii_mode: true
    # 代码与开发工具
    code.exe:
      ascii_mode: true
    "code - insiders.exe":
      ascii_mode: true
    cursor.exe:
      ascii_mode: true
    devenv.exe:
      ascii_mode: true
    sublime_text.exe:
      ascii_mode: true
    idea64.exe:
      ascii_mode: true
    pycharm64.exe:
      ascii_mode: true
    # 办公与笔记
    winword.exe:
      ascii_mode: true
    excel.exe:
      ascii_mode: true
    powerpnt.exe:
      ascii_mode: true
    notion.exe:
      ascii_mode: true
    obsidian.exe:
      ascii_mode: true
    # 工具类 (PowerToys / 启动器 / 截图 / 密码管理器等)
    powertoys.powerlauncher.exe:
      ascii_mode: true
    powertoys.quickaccess.exe:
      ascii_mode: true
    everything.exe:
      ascii_mode: true
    snipaste.exe:
      ascii_mode: true
    sharex.exe:
      ascii_mode: true
    keepassxc.exe:
      ascii_mode: true
    mstsc.exe:
      ascii_mode: true

  # ─── 配色：macOS Dark ───
  # color_format: rgba —— 8 位十六进制按 0xRRGGBBAA 解析；6 位自动补满 alpha
  "preset_color_schemes/macOS_Dark":
    name: "macOS Dark"
    author: kylin
    color_format: rgba
    back_color: 0x202020FF                    # 候选窗底色
    text_color: 0xF5F5F7                      # 输入编码
    label_color: 0x98989D                     # 序号
    candidate_text_color: 0xF5F5F7            # 候选字
    comment_text_color: 0x98989D              # 注释
    hilited_text_color: 0xF5F5F7
    hilited_candidate_back_color: 0x0A84FF    # 选中项背景（macOS 蓝）
    hilited_candidate_text_color: 0xFFFFFF
    hilited_label_color: 0xFFFFFF
    hilited_comment_text_color: 0xFFFFFF
    candidate_back_color: 0x00000000          # 非选中项背景透明
    hilited_back_color: 0x00000000
    shadow_color: 0x00000088                  # 窗口投影
    hilited_candidate_border_color: 0x00000000

  # ─── 配色：macOS Light ───
  "preset_color_schemes/macOS_Light":
    name: "macOS Light"
    author: kylin
    color_format: rgba
    back_color: 0xFFFFFFFF                    # 纯白底（8 位，alpha 补 FF）
    text_color: 0x1D1D1F                      # 苹果灰
    label_color: 0x86868B
    candidate_text_color: 0x1D1D1F
    comment_text_color: 0x86868B
    hilited_text_color: 0x1D1D1F
    hilited_candidate_back_color: 0x007AFF    # 选中项背景（亮蓝）
    hilited_candidate_text_color: 0xFFFFFF
    hilited_label_color: 0xFFFFFF
    hilited_comment_text_color: 0xFFFFFF
    candidate_back_color: 0x00000000
    hilited_back_color: 0x00000000
    shadow_color: 0x00000030                  # 浅投影
